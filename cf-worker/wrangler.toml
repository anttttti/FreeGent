name = "freegent-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Served only at proxy.freegent.ai; the account's *.workers.dev URL is disabled.
# Self-hosting in your own account: delete these two settings and use the workers.dev URL.
workers_dev = false
routes = [{ pattern = "proxy.freegent.ai", custom_domain = true }]

# Optional: add shared API keys so GitHub Pages users can access those
# providers without configuring their own keys in the browser.
# Store them as encrypted Cloudflare secrets — never put values here.
#
# Run once per key you want to share:
#
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put NOUS_API_KEY
#   npx wrangler secret put TOKENHARBOR_API_KEY
#   npx wrangler secret put NVIDIA_API_KEY
#   npx wrangler secret put VERCEL_API_KEY
#
# Keys are injected server-side and never visible to browser clients.

# Per-client-IP rate limit for requests that use a shared key above, and for the open
# ?url= fetch path. Anyone can call this Worker (an Origin header is easy to fake), so this is
# what bounds use of the shared keys. worker.js keys the limit as "key:<ip>" / "get:<ip>".
# period must be 10 or 60 seconds; namespace_id is any number unique within the account.
[[ratelimits]]
name = "FG_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 60
  period = 60

# Chat logs users send from the app (POST /log). Create the namespace once and paste its id here:
#   npx wrangler kv namespace create FG_LOGS
# Read logs:  npx wrangler kv key list --binding FG_LOGS --remote
#             npx wrangler kv key get log:<id> --binding FG_LOGS --remote
# Until the binding exists, /log answers 503.
[[kv_namespaces]]
binding = "FG_LOGS"
id = "5cf3c4410d8c42e88c416fd7ff5e04b3"
