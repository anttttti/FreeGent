user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
    # Round-robin over local vLLM instances.
    # Replace with your actual IP(s); weight reflects relative GPU capacity.
    upstream backend {
    	least_conn;
        server 192.168.x.y:8000 max_conns=150 weight=5;
	server 192.168.x.z:8000 max_conns=150 weight=3;
	}

    # vLLM API proxy (port 80) — used by the WebUI CORS proxy and direct LLM calls
    server {
    	   listen 80;
	   location / {
	   	    proxy_pass http://backend;
		    proxy_connect_timeout 300s;
		    proxy_send_timeout 3600s;
		    proxy_read_timeout 3600s;
		    # Disable buffering so SSE chunks reach the mobile client immediately.
		    proxy_buffering off;
		    proxy_cache off;
		    }
	}

    # WebUI proxy (port 3000) — forwards to the Vite dev server running on :5000.
    # Start Vite with: FG_HTTP=1 npm run dev:lan
    # Then access the UI from other devices at: http://<this-host>:3000
    server {
           listen 3000;
           location / {
                proxy_pass http://127.0.0.1:5000;
                proxy_http_version 1.1;
                # WebSocket support (Vite HMR)
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_connect_timeout 30s;
                proxy_send_timeout 3600s;
                proxy_read_timeout 3600s;
                proxy_buffering off;
                proxy_cache off;
           }
    }
}
